[project]
name = "spago-core"
version = "0.1.0"
description = "SPAgo core service: structure-native patent intelligence workspace (M0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "duckdb>=1.0",
    "pyarrow>=15",
    "rdkit>=2023.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spago_core*"]

# The reviewed ligand/receptor/pathway catalog is data, so it must ship inside
# the installed package. Without it the resolver silently loses its scope
# expansion in a container while still working from a source checkout (found by
# a deployed-artifact browser check, 2026-09-15).
[tool.setuptools.package-data]
spago_core = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
