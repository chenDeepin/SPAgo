name: spago

services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    image: spago-db:pg15-rdkit
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spago}
      POSTGRES_USER: ${POSTGRES_USER:-spago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spago}
    # The database is a private component of the app stack: by default it is
    # reachable only from the host loopback (dev tooling). Do not expose it to a
    # LAN without changing the demo credentials and reading docs/runbook.md.
    ports:
      - "${SPAGO_DB_BIND:-127.0.0.1}:${SPAGO_DB_PORT:-5432}:5432"
    volumes:
      - spago-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      # B-34: distinguishable build identity, baked into the image env by the
      # Dockerfile. The default keeps plain `docker compose up --build` working
      # and serves an explicit "unknown"; scripts/build_app.sh exports a
      # computed `git describe --always --dirty` identity before building.
      # Deliberately absent from `environment:` below — a runtime value there
      # would mask the identity the image was actually built with.
      args:
        SPAGO_BUILD_ID: ${SPAGO_BUILD_ID:-unknown}
    image: spago-app:m0
    environment:
      SPAGO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-spago}:${POSTGRES_PASSWORD:-spago}@db:5432/${POSTGRES_DB:-spago}
      SPAGO_FIXTURE_DIR: /app/data/fixtures
      SPAGO_MIGRATIONS_DIR: /app/migrations
      SPAGO_DEPICTION_CACHE_DIR: /app/data/cache/depictions
      # demo (default) loads the synthetic fixture at startup; none applies
      # migrations only — set it in .env for real-data deployments that import
      # SureChEMBL packages (see docs/runbook.md).
      SPAGO_SEED_MODE: ${SPAGO_SEED_MODE:-demo}
      # LLM endpoint: compose does not inject .env automatically — these three
      # are passed explicitly. All empty → offline extractive summaries.
      SPAGO_LLM_BASE_URL: ${SPAGO_LLM_BASE_URL:-}
      SPAGO_LLM_API_KEY: ${SPAGO_LLM_API_KEY:-}
      SPAGO_LLM_MODEL: ${SPAGO_LLM_MODEL:-}
      # Opt-in thinking-disable switch (DeepSeek-style `thinking` parameter);
      # off unless the operator sets it, see .env.example.
      SPAGO_LLM_DISABLE_THINKING: ${SPAGO_LLM_DISABLE_THINKING:-false}
      # Opt-in JSON decoding mode (`response_format`); off unless set.
      SPAGO_LLM_JSON_MODE: ${SPAGO_LLM_JSON_MODE:-false}
      # Model-usage bounds (ONLINE-04). Non-zero by default so a misconfigured
      # deployment cannot offer unlimited paid usage; set 0 deliberately to lift.
      SPAGO_LLM_USER_TOKEN_LIMIT: ${SPAGO_LLM_USER_TOKEN_LIMIT:-200000}
      SPAGO_LLM_DEPLOYMENT_TOKEN_LIMIT: ${SPAGO_LLM_DEPLOYMENT_TOKEN_LIMIT:-2000000}
      SPAGO_LLM_QUOTA_WINDOW: ${SPAGO_LLM_QUOTA_WINDOW:-month}
      # Hosted access (ONLINE-03, ADR-0002). The default keeps the local
      # single-user product: no sign-in, existing rows stay unattached. Setting
      # "required" makes every workspace request need a session — read
      # docs/runbook.md §H1–H10 (HTTPS, private database, real secrets) first.
      SPAGO_AUTH_MODE: ${SPAGO_AUTH_MODE:-disabled}
      SPAGO_COOKIE_SECURE: ${SPAGO_COOKIE_SECURE:-false}
      SPAGO_SESSION_TTL_HOURS: ${SPAGO_SESSION_TTL_HOURS:-12}
      SPAGO_CORS_ORIGINS_EXTRA: ${SPAGO_CORS_ORIGINS_EXTRA:-}
      # Potency reference policy (ONLINE-06). The threshold at or below which a
      # reported value counts as a starting point; it travels with every verdict
      # and export, so a changed value is visible in the artifact, not hidden.
      SPAGO_ACTIVITY_THRESHOLD_NM: ${SPAGO_ACTIVITY_THRESHOLD_NM:-10000}
      SPAGO_ACTIVITY_MIN_COMPOUNDS: ${SPAGO_ACTIVITY_MIN_COMPOUNDS:-10}
    ports:
      # loopback binding by default: enable paid model keys only behind your own
      # authentication layer before exposing this port on a LAN/hosted interface
      - "${SPAGO_APP_BIND:-127.0.0.1}:${SPAGO_APP_PORT:-8000}:8000"
    volumes:
      - spago-depiction-cache:/app/data/cache/depictions
    extra_hosts:
      # lets SPAGO_LLM_BASE_URL use http://host.docker.internal:<port> for
      # explicitly configured local model endpoints (Linux docker)
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  spago-db-data:
  spago-depiction-cache:
